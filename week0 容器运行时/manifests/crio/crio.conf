# ============================================================
# CRI-O 配置示例
# ============================================================
#
# 【核心配置】
# - runtime: OCI 运行时配置
# - network: CNI 网络配置
# - registries: 镜像仓库配置
#
# 【使用方式】
# 1. 复制到 /etc/crio/crio.conf
# 2. systemctl restart crio
#
# ============================================================

# ============================================================
# 通用配置
# ============================================================
[general]
  # 日志级别
  log_level = "info"

  # 钩子目录
  hooks_dir = [
    "/usr/share/containers/oci/hooks.d",
    "/etc/containers/oci/hooks.d"
  ]

# ============================================================
# 网络配置
# ============================================================
[network]
  # CNI 插件目录
  cni_plugin_dirs = [
    "/opt/cni/bin",
    "/usr/libexec/cni"
  ]

  # CNI 配置目录
  cni_config_dir = "/etc/cni/net.d"

# ============================================================
# 运行时配置
# ============================================================
[runtime]
  # 默认运行时
  default_runtime = "runc"

  # conmon 路径
  conmon = "/usr/bin/conmon"

  # conmon 环境变量
  conmon_env = [
    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  ]

  # 暂停容器镜像
  pause_image = "registry.k8s.io/pause:3.9"

  # ============================================================
  # OCI 运行时配置
  # ============================================================
  [runtimes]
    # runc（默认）
    [runtimes.runc]
      runtime_path = "/usr/bin/runc"
      runtime_type = "oci"
      runtime_root = "/run/runc"

    # NVIDIA 运行时（GPU）
    [runtimes.nvidia]
      runtime_path = "/usr/bin/nvidia-container-runtime"
      runtime_type = "oci"
      runtime_root = "/run/runc"

# ============================================================
# 镜像配置
# ============================================================
[image]
  # 默认传输类型
  default_transport = "docker://"

  # 镜像拉取超时
  pull_timeout = "5m"

  # 并发拉取数
  max_concurrent_downloads = 10

# ============================================================
# 镜像仓库配置
# ============================================================
[registries]
  # 允许的仓库
  [registries.search]
    registries = [
      "docker.io",
      "registry.k8s.io",
      "quay.io"
    ]

  # 不安全的仓库（仅测试）
  [registries.insecure]
    registries = []

  # 需要认证的仓库
  [registries.block]
    registries = []

# ============================================================
# 安全配置
# ============================================================
[seccomp]
  # seccomp profile
  profile = "/usr/share/containers/seccomp.json"
  enabled = true

# ============================================================
# 存储配置
# ============================================================
[storage]
  # 存储驱动
  driver = "overlay"

  # 存储路径
  graphroot = "/var/lib/containers/storage"

  # 运行时路径
  runroot = "/run/containers/storage"

# ============================================================
# API 配置
# ============================================================
[api]
  # 监听地址
  listen = "/run/crio/crio.sock"

# ============================================================
# Metrics 配置（监控）
# ============================================================
[metrics]
  # metrics 端点
  enable_metrics = true
  metrics_port = 9090