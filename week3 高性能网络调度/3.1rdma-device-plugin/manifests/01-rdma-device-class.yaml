# ============================================================
# 设备类定义（可选，用于DRA演进）
# ============================================================
#
# 【说明】
# 本配置为未来DRA机制的预留配置
# 当前Device Plugin机制下可以跳过此文件
#
# 【使用方式】
# DRA机制启用后，使用DeviceClass替代Device Plugin注册

apiVersion: resource.k8s.io/v1alpha1
kind: DeviceClass
metadata:
  name: rdma-device-class
spec:
  # ============================================================
  # 设备选择器
  # ============================================================
  selectors:
    - deviceType: rdma
      selectors:
        # 按设备类型筛选
        - key: type
          operator: In
          values: ["ib", "roce"]

  # ============================================================
  # 设备属性配置
  # ============================================================
  configuration:
    # 设备类型标识
    type: rdma