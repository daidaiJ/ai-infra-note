# ============================================================
# KV Events 配置示例 (vLLM 启动参数)
# ============================================================

# vLLM Pod 环境变量配置
env:
  # ============================================================
  # Hash Seed - 必须与 EPP hashSeed 一致
  # ============================================================
  - name: PYTHONHASHSEED
    value: "42"

# ============================================================
# vLLM 启动参数
# ============================================================
# vllm serve ... \
#   --block-size 64 \                           # 必须与 EPP blockSize 一致
#   --kv-events-config '{
#     "publisher": "zmq",
#     "endpoint": "tcp://*:5556",
#     "topic": "kv@${POD_IP}:${POD_PORT}@Qwen/Qwen3-32B"
#   }'

---
# ============================================================
# KV Events Config JSON 格式
# ============================================================
{
  "publisher": "zmq",
  "endpoint": "tcp://*:5556",
  "topic": "kv@${POD_IP}:5556@Qwen/Qwen3-32B"
}

---
# ============================================================
# EPP KV Events 配置
# ============================================================
# 在 precise-prefix-cache-scorer 中配置:
kvEventsConfig:
  topicFilter: "kv@"             # 过滤所有 kv@ 开头的 topic
  discoverPods: true             # 自动发现 vLLM Pod
  concurrency: 4                 # Worker 并发数
  podDiscoveryConfig:
    socketPort: 5556             # ZMQ 端口