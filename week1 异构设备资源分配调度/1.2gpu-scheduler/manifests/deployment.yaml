# ============================================================
# GPU 感知调度器 Kubernetes 部署清单
# ============================================================

---
# ============================================================
# 1. RBAC 权限配置
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-scheduler
rules:
  # 节点信息读取
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Pod 信息读取
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update"]
  # Pod 绑定操作
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  # Pod 状态更新
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]
  # 事件记录
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # Lease 对象（领导者选举）
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-scheduler
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: kube-system

---
# ============================================================
# 2. ConfigMap: 调度器配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    clientConnection:
      kubeconfig: /etc/kubernetes/scheduler.conf
    profiles:
      - schedulerName: gpu-scheduler
        plugins:
          filter:
            enabled:
              - name: DeviceUUIDMatcher
              - name: GPUUtilizationBalancer
              - name: NodeUnschedulable
              - name: NodeName
              - name: TaintToleration
              - name: NodeAffinity
              - name: NodeResourcesFit
          score:
            enabled:
              - name: DeviceUUIDMatcher
                weight: 100
              - name: GPUUtilizationBalancer
                weight: 50
              - name: NodeResourcesBalancedAllocation
                weight: 1

---
# ============================================================
# 3. Deployment: 调度器实例
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler
  namespace: kube-system
  labels:
    app: gpu-scheduler
spec:
  replicas: 2  # 高可用部署
  selector:
    matchLabels:
      app: gpu-scheduler
  template:
    metadata:
      labels:
        app: gpu-scheduler
    spec:
      serviceAccountName: gpu-scheduler
      containers:
        - name: scheduler
          image: your-registry/gpu-scheduler:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/kube-scheduler
            - --config=/etc/gpu-scheduler/scheduler-config.yaml
            - --v=4  # 日志级别
          volumeMounts:
            - name: config
              mountPath: /etc/gpu-scheduler
            - name: kubeconfig
              mountPath: /etc/kubernetes
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: gpu-scheduler-config
        - name: kubeconfig
          secret:
            secretName: kube-scheduler.conf  # Kubeconfig secret

---
# ============================================================
# 4. 示例 Pod: 使用 GPU 调度器
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload-example
  annotations:
    # 方式1: 指定单个 GPU 设备 UUID
    scheduler.example.com/target-gpu-uuid: "GPU-abc123-0001"

    # 方式2: 指定多个 GPU 设备 UUID（逗号分隔）
    # scheduler.example.com/target-gpu-uuids: "GPU-abc123-0001,GPU-abc123-0002"
spec:
  # 指定使用 GPU 调度器
  schedulerName: gpu-scheduler

  containers:
    - name: gpu-container
      image: nvidia/cuda:12.0-runtime-ubuntu22.04
      command: ["python", "train.py"]
      resources:
        limits:
          nvidia.com/gpu: 1  # 请求 1 个 GPU
          memory: "8Gi"
          cpu: "4"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      emptyDir: {}

---
# ============================================================
# 5. 示例 Pod: 不指定设备，由调度器自动选择低负载节点
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload-auto
spec:
  schedulerName: gpu-scheduler

  containers:
    - name: gpu-container
      image: nvidia/cuda:12.0-runtime-ubuntu22.04
      command: ["python", "inference.py"]
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: "4Gi"
          cpu: "2"