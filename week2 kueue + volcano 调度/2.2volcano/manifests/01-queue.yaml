# ============================================================
# Queue: Volcano队列配置
# ============================================================
#
# 【核心字段】
# - weight: 队列权重（公平分配比例）
# - capability: 队列资源能力上限
# - state: 队列状态（Open/Closed）
#
# 【使用方式】
# 1. 创建Queue定义队列能力
# 2. Job指定queue字段关联
# 3. 公平分享算法按权重分配

---
# ============================================================
# 示例1: 训练队列（高权重）
# ============================================================
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: training-queue
spec:
  # ============================================================
  # 权重：训练任务权重较高
  # ============================================================
  weight: 3                    # 3倍资源分配权重

  # ============================================================
  # 能力：队列资源上限
  # ============================================================
  capability:
    cpu: "100"                  # 最多100核CPU
    memory: "200Gi"             # 最多200GB内存
    nvidia.com/gpu: "50"        # 最多50张GPU

  # ============================================================
  # 状态：队列开启接受任务
  # ============================================================
  state: Open

---
# ============================================================
# 示例2: 推理队列（中等权重）
# ============================================================
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: inference-queue
spec:
  weight: 2                    # 2倍资源分配权重

  capability:
    cpu: "50"
    memory: "100Gi"
    nvidia.com/gpu: "20"

  state: Open

---
# ============================================================
# 示例3: 开发队列（低权重）
# ============================================================
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: dev-queue
spec:
  weight: 1                    # 1倍资源分配权重

  capability:
    cpu: "20"
    memory: "40Gi"
    nvidia.com/gpu: "10"

  state: Open

---
# ============================================================
# 示例4: 暂停队列（不接受新任务）
# ============================================================
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: paused-queue
spec:
  weight: 1
  capability:
    nvidia.com/gpu: "5"

  state: Closed                # 队列关闭，不接受新任务